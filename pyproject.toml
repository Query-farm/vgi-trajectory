[project]
name = "vgi-trajectory-worker"
version = "0.3.0"
description = "Python GIS trajectory analysis exposed as VGI SQL functions."
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.2,<3",
    "shapely>=2.1,<3",
    "pyproj>=3.7,<4",
    # [http] adds the HTTP transport (`--http`) used by Docker deploys.
    # SDK bumps go through the template (minor bumps can raise the protocol).
    "vgi-python[http]>=0.55.1,<0.56",
]

[project.optional-dependencies]
# HTTP-serving extra installed by the Docker image (`pip install '.[serve]'`):
# `http` so the container can serve `--http` (/health + VGI RPC), plus `oauth`
# (JWT verification) so the image can run in Orchard hosted mode
# (`VGI_ORCHARD_HOSTED=1` with VGI_JWT_ISSUER/AUDIENCE/JWKS_URI and VGI_SIGNING_KEY).
serve = [
    "vgi-python[http,oauth]>=0.55.1,<0.56",
]

[project.scripts]
vgi-trajectory-worker = "trajectory_worker.worker:main"

[dependency-groups]
dev = [
    # `scripts/run_demo.py --engine haybarn` runs the SQL contract in Haybarn.
    "vgi-python[haybarn]>=0.55.1,<0.56",
    "pytest>=8.4",
    "mypy>=1.18",
    "ruff>=0.14",
    "pyarrow-stubs>=20.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trajectory_worker"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D"]
# RUF012: the SDK declares metadata as plain class attributes on `class Meta`.
ignore = ["D203", "D213", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"test/*" = ["D"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests", "scripts/run_demo.py", "scripts/verify_package.py", "scripts/verify_container.py"]

[[tool.mypy.overrides]]
module = ["vgi.*", "vgi_rpc.*"]
follow_untyped_imports = true

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
allow-init-docstring = true
skip-checking-short-docstrings = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["rasterio.*", "shapely.*", "pyproj.*", "laspy.*", "scipy.*", "pyflwdir.*"]
ignore_missing_imports = true
